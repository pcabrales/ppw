name: LLM-Based Bug Scan (LocalAI)

on:
  push:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start LocalAI
        uses: mudler/localai-github-action@v1
        with:
          model: 'gpt4all-lora-quantized'  # or any model from models.localai.io

      - name: Run Bug Detector
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF="$(git diff HEAD~1 HEAD)"
          else
            DIFF="$(git show HEAD)"
          fi
          curl -s -X POST http://localhost:8080/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model":"gpt4all-lora-quantized",
              "messages":[
                {"role":"system","content":"You are a senior software engineer."},
                {"role":"user","content":"Review this code diff and list potential bugs or edge cases:\n\n'"$DIFF"'"}
              ],
              "max_tokens":512
            }' | jq .



