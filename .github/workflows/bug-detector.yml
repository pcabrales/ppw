name: LLM-Based Bug Scan

on:
  push:
    branches:
      - main

jobs:
  bug_scan:
    name: Scan for Potential Bugs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run LLM Bug Detector
        uses: Just-Moh-it/openai@v0.0.1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          openai-mode: "completion"
          openai-params: >
            {
              "model": "gpt-4",
              "prompt": "You are a senior software engineer and seasoned coder with an eye for detecting bugs. Review this code diff and list any potential bugs or edge cases:\n\n${{ github.event.head_commit.message }}\n\nDiff:\n$(git diff HEAD~1 HEAD)",
              "max_tokens": 512,
              "temperature": 0
            }
